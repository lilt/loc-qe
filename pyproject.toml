[project]
name = "loccheck"
version = "0.1.0"
description = "LocCheck: Create localisation specific challenge sets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",  # pinned: the paper artifacts were generated on pandas 2.x
    "numpy>=1.24",
    "regex>=2023.0.0",
    "sacrebleu>=2.4",
    "datasets>=2.19",
    "langcodes>=3.3",
]

[project.scripts]
loccheck-generate = "loccheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loccheck"]
